[package]
name = "wheel-keyboard-desktop"
description = "Desktop app for the wheel keyboard: type with two thumbs on a touchscreen, mouse or trackpad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "wheel-keyboard"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
wheel-keyboard = { path = "../wheel-keyboard" }
