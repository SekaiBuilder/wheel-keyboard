name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the desktop app
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Desktop app builds
        run: cargo build --release -p wheel-keyboard-desktop
      - name: C example
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --release -p wheel-keyboard-ffi
          cc -Wall -Wextra -Werror -o c-example examples/c/main.c \
            -Icrates/wheel-keyboard-ffi/include target/release/libwheel_keyboard_c.a \
            $([ "$RUNNER_OS" = Linux ] && echo "-lpthread -ldl -lm")
          test "$(./c-example)" = "s"

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy checks
        run: scripts/check.sh
      - name: Demo JavaScript syntax
        run: |
          awk '/<script>/{f=1;next}/<\/script>/{f=0}f' docs/index.html > /tmp/demo.js
          node --check /tmp/demo.js
